{% extends 'base.html' %}{% block content %}<p><a href="{{ url_for('staff.queue') }}">← Staff workspace</a></p><h1>Archived requests</h1><p>Separate, audited access for the current scoped manager.</p><section class="panel"><form class="auth-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="case">Archived request</label><select id="case" name="case">{% for row in rows %}<option value="{{ row._id }}">{{ row.reference }}</option>{% endfor %}</select><label for="purpose">Review purpose</label><textarea id="purpose" name="purpose" maxlength="1000" required rows="3"></textarea><button class="button">Open with audit</button></form>{% if case %}<h2>{{ case.reference }}</h2><div class="request-description">{{ case.description }}</div>{% endif %}</section>{% endblock %}
