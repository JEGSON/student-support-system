{% extends 'base.html' %}{% block content %}<p class="breadcrumb"><a href="{{ url_for('staff.queue') }}">← Staff workspace</a></p><h1>Route an initial request</h1><p class="reference">{{ case.reference }}</p><div class="alert"><p>This audited routing claim expires within 30 minutes. Later messages and internal notes are unavailable.</p></div><section class="panel"><h2>{{ case.student.display_name }}</h2><p class="request-description">{{ case.description }}</p><form class="auth-form" method="post" action="{{ url_for('staff.action',case_id=case._id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="version" value="{{ case.version }}"><input type="hidden" name="operation" value="route"><label for="team">Responsible team</label><select id="team" name="team">{% for team in teams %}<option value="{{ team._id }}">{{ team.name }}</option>{% endfor %}</select><label for="reason">Routing reason</label><textarea id="reason" name="reason" required maxlength="1000" rows="3"></textarea><button class="button" type="submit">Route request</button></form><form method="post" action="{{ url_for('staff.release',case_id=case._id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button secondary">Release claim</button></form></section>{% endblock %}
