[project]
name = "student-support-system"
version = "0.1.0"
description = "Synthetic UK university student support demonstration"
requires-python = ">=3.13,<3.15"
dependencies = [
    "authlib>=1.9,<2",
    "cryptography>=50,<51",
    "Flask==3.1.3",
    "flask-wtf>=1.2,<2",
    "gunicorn>=23,<27",
    "itsdangerous>=2.2,<3",
    "pymongo==4.19.0",
    "python-dotenv>=1.2,<2",
    "requests>=2.34,<3",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "playwright>=1.58,<2",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "runtime: requires the isolated local dependency stack",
    "browser: opt-in isolated browser rendering checks",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["runtime", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Direct script entry points add the repository root before importing the app.
"scripts/run_local.py" = ["E402"]
"scripts/start_dependencies.py" = ["E402"]
"scripts/database_setup.py" = ["E402"]

"scripts/provision_identity.py" = ["E402"]
"scripts/bootstrap_access.py" = ["E402"]
"scripts/configure_routing.py" = ["E402"]
"scripts/run_worker.py" = ["E402"]
"scripts/dispose_synthetic.py" = ["E402"]
