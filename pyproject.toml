[project]
name = "student-support-system"
version = "0.1.0"
description = "Synthetic UK university student support demonstration"
requires-python = ">=3.13,<3.15"
dependencies = ["Flask==3.1.3", "pymongo==4.19.0", "python-dotenv>=1.2,<2"]

[dependency-groups]
dev = [
    "playwright>=1.58,<2",
    "pytest>=8.4,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["runtime: requires the isolated local dependency stack", "browser: opt-in isolated browser rendering checks"]
